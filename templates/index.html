<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Llama</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Co-Llama</h1>
        <form id="message-form">
            <div class="form-group">
                <label for="message">Message:</label>
                <input type="text" class="form-control" id="message" placeholder="Enter your message">
            </div>
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
        <div id="responses" class="mt-4">
            <h2>Responses:</h2>
            <ul class="list-group" id="response-list"></ul>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#message-form').on('submit', function(event) {
                event.preventDefault();
                var message = $('#message').val();
                $.ajax({
                    url: '/',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ message: message }),
                    success: function(response) {
                        var responseItem = $('<li class="list-group-item"></li>').text(response);
                        $('#response-list').append(responseItem);
                        $('#message').val('');
                    }
                });
            });
        });
    </script>
</body>
</html>
